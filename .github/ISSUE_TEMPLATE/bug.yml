name: Bug report
description: Report a reproducible ASA defect without sensitive transcript data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials or unsanitized transcripts. Report security vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What outcome did you expect?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened instead? Include the exact error when safe.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give minimal steps using synthetic or sanitized data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ASA version or commit
    validations:
      required: true
  - type: dropdown
    id: implementation
    attributes:
      label: Implementation
      options:
        - Rust V2
        - TypeScript V1
        - Both or unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Claude/Codex version, and relevant configuration without secrets.
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Sanitized logs, fixture references, or screenshots.
