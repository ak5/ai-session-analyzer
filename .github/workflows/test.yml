name: test

# Quality gate — build + unit + synthetic-fixture e2e. Runs on every push to
# main/dev and on PRs. `quality-gates` is the required check on main.
# Public repo: GitHub-hosted runners are free with no minute caps, and keep
# fork-PR code off our own hardware.

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # tsc -b project references + esbuild CLI bundle
      - run: pnpm test # unit suite
      - run: pnpm e2e:setup --synthetic # format-faithful fixtures, no auth
      - run: pnpm test:e2e # drives the built asa binary end-to-end

  # main accepts releases from dev and reviewed production repairs from
  # hotfix/*. Branch protection cannot enforce a PR's source branch, so fail
  # loudly for every other path.
  main-source-policy:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev' && !startsWith(github.head_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "::error::main accepts PRs only from dev or hotfix/* (got ${{ github.head_ref }})"; exit 1'
