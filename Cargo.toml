[workspace]
members = [
  "crates/asa-adapters",
  "crates/asa-analysis",
  "crates/asa-cli",
  "crates/asa-core",
  "crates/asa-daemon",
  "crates/asa-otel",
  "crates/asa-semconv",
  "crates/asa-store",
]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ak5/ai-session-analyzer"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
duckdb = { version = "1.10505.0", default-features = false, features = ["bundled"] }
fs2 = "0.4"
hex = "0.4"
http = "1.3"
opentelemetry-proto = { version = "0.31", features = ["gen-tonic", "logs", "trace", "metrics"] }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["serde", "v7"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
